<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MSE Settle: reconcile courier cash-on-delivery remittances against your orders, line by line, in MAD." />
    <meta name="theme-color" content="#1D3B72" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MSE Transport" />
    <meta property="og:title" content="MSE Settle: courier cash settlement" />
    <meta property="og:description" content="Reconcile courier COD remittances against your orders, line by line. Part of the MSE Transport suite." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>MSE Settle</title>
    <script>
      // apply the saved theme before first paint (no flash of the wrong theme)
      try {
        var t = localStorage.getItem('settle.theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
