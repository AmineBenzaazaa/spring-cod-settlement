# Serves the built SPA and proxies the API to the Spring Boot app. Same origin for the browser:
# no CORS configuration in the API, and the bearer token never has to live in a cookie.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # statement uploads are capped at 5 MB by Spring (6 MB per request): let them through
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # hashed assets can be cached forever; index.html never
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
