spring:
  application:
    name: cod-settlement
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cod_settlement}
    username: ${DB_USERNAME:cod}
    password: ${DB_PASSWORD:cod}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    # Never let Hibernate touch the schema: Flyway owns it, Hibernate only checks it.
    hibernate:
      ddl-auto: validate
    # No lazy loading from the web layer: services return DTOs built inside a transaction.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL:INFO}

app:
  jwt:
    # No default on purpose: the app refuses to start without a 32+ character secret.
    secret: ${APP_JWT_SECRET:}
    access-token-ttl: ${APP_JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${APP_JWT_REFRESH_TTL:7d}
    issuer: cod-settlement
