name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + slice tests (Surefire), Testcontainers PostgreSQL tests (Failsafe),
      # merged JaCoCo report and coverage gate. Docker is available on GitHub-hosted runners.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Unit and component tests (Vitest)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [verify, web]
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (web on :3200, API on :18080)
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Playwright
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Playwright e2e
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t spring-cod-settlement:ci .
          docker build -t spring-cod-settlement-web:ci web
